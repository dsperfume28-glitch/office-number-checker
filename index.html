<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Number Checker</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
    }

    .box {
      background: white;
      width: 90%;
      max-width: 420px;
      padding: 35px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
    }

    .blocked {
      color: #d60000;
    }

    .allowed {
      color: #07852c;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Number Checker</h1>

  <p>Enter customer phone number</p>

  <input
    id="phone"
    type="tel"
    placeholder="0771234567"
    maxlength="15"
  >

  <button onclick="checkNumber()">
    CHECK NUMBER
  </button>

  <div id="result"></div>

</div>

<script>

const SUPABASE_URL = "https://csrjgvkixypqobmrjrfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_0wPhBNco3_B8ppX5Kc54hA_-3r8-yLa";

async function checkNumber() {

  const phone =
    document.getElementById("phone").value.trim();

  const result =
    document.getElementById("result");

  if (!phone) {
    result.className = "blocked";
    result.innerHTML = "Enter a phone number";
    return;
  }

  result.className = "";
  result.innerHTML = "Checking...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/blocked_number?Phone=eq.${encodeURIComponent(phone)}&select=Phone`,
      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Database error");
    }

    const data = await response.json();

    if (data.length > 0) {

      result.className = "blocked";
      result.innerHTML = "❌ BLOCKED";

    } else {

      result.className = "allowed";
      result.innerHTML = "✅ OK";

    }

  } catch (error) {

    result.className = "blocked";
    result.innerHTML = "⚠️ CONNECTION ERROR";

  }
}

</script>

</body>
</html>
